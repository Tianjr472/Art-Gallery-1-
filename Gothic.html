<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="gothic.css">
    <title>Gothic</title>
</head>
<body>

    <!-- 【第一层】最底层：大背景 -->
    <div class="hero-bg"></div>
    
    <!-- 占位背景图，随便放个暗色图或者纯色 -->
    <img class="gallery-img" 
        style="
        position: absolute; 
        top: 0; left: 0; 
        width: 100vw; height: 100vh; 
        object-fit: cover;
        background-color: #050505;
        filter: brightness(0.2) contrast(1.2);
        z-index: 0;
    ">

    <!-- 【第二层】中景：彩窗 + 圣光 + 天使 (z-index: 2~4) -->
    <!-- 彩窗 -->

       <img class="gallery-img anim-fade-up" src="Gothic images/window(1).jpg" style="
        position: absolute; 
        top: 0%; left: 68%;  
        transform: translateX(-50%);
        width: 35vw; 
        height: auto; 
        filter: brightness(0.8)
        drop-shadow(0 0 30px rgba(255,255,255,0.2));
        z-index: 2;
    ">

    <img class="gallery-img anim-fade-up" src="Gothic images/window.png" style="
        position: absolute; 
        top: -10%; left: -8%;  
        transform: translateX(-50%);
        width: 43vw; 
        height: auto; 
        filter: brightness(0.7)
        drop-shadow(0 0 30px rgba(255,255,255,0.2));
        z-index: 2;
    ">

    <img class="gallery-img anim-fade-up" src="Gothic images/angel(2).png" style="
        position: absolute; 
        top: -10%; left: 20%;  
        transform: translateX(-50%);
        width: 65vw; 
        height: auto; 
        filter: brightness(0.6)
        drop-shadow(0 0 30px rgba(255,255,255,0.2));
        z-index: 2;
    ">

    <!-- 圣光素材 (你的图) -->
    <img class="gallery-img anim-fade-up" src="Gothic images/light.png" style="
        position: absolute; 
        top: 12%; left: 27%; 
        transform: translateX(-50%);
        width: 45vw; 
        height: auto; 
        filter: brightness(2);
        z-index: 3;
    ">


    <!-- 天使雕塑 -->
    <img class="gallery-img anim-drop-in" src="Gothic images/angel(1).png" style="
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%); /* 强制绝对居中 */
        margin: 0 auto;
        height: 90vh; /* 确保高度填满 */
    ">

    <!-- 【第三层】前景：两侧高耸尖塔 (z-index: 5) -->
    <!-- 左侧尖塔 (第一个出场) -->
    <img class="gallery-img anim-slide-left" src="Gothic images/church(1).png" style="
        position: absolute; 
        bottom: 0; left: -8vw; 
        height: 105vh; 
        width: auto;
        filter: brightness(0.9) contrast(1.1);
        z-index: 3;
    ">

    <!-- 右侧尖塔 (第一个出场) -->
    <img class="gallery-img anim-slide-right" src="Gothic images/church(2).png" style="
        position: absolute; 
        bottom: -1; right: 0vw;
        height: 120vh; 
        width: auto;
        filter: brightness(0.8) contrast(1.1);
        z-index: 5;
    ">

    <!-- 【第四层】文字与毛玻璃按钮 (z-index: 6) -->
     <!-- 你的哥特字体图片（当作图层叠上去） -->
    <img class="gallery-img anim-zoom-in" src="Gothic images/text.png" style="
        position: absolute;
        top: 5%;
        left: 50%;
        transform: translateX(-50%); /* 强制绝对居中 */
        width: 80vw;
        z-index: 10;
    ">

    <!-- 毛玻璃按钮 -->
    <a href="Gothic-detail.html" class="explore-btn anim-fade-in">
        ENTER THE DARKNESS <span>↗</span>
    </a>

    <!-- 【第五层】暗角滤镜 (增强氛围) -->
    <div class="vignette-overlay"></div>

</body>
</html>
