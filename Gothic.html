<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="gothic.css">
    <title>Gothic</title>
</head>
<body>

    <!-- 纯黑底色 -->
    <div style="position: absolute; inset: 0; background-color: #050505; z-index: -1;"></div>

    <!-- 左右对称彩窗 -->
    <img class="img-window-left" src="Gothic images/window.png" style="
        position: absolute; top: 10%; left: 50%; margin-left: -38vw; width: 22vw; height: auto; z-index: 1; filter: brightness(0.8) drop-shadow(0 0 30px rgba(255,255,255,0.2));
    ">
    <img class="img-window-right" src="Gothic images/window(1).jpg" style="
        position: absolute; top: 10%; left: 50%; margin-left: 16vw; width: 22vw; height: auto; z-index: 1; filter: brightness(0.8) drop-shadow(0 0 30px rgba(255,255,255,0.2));
    ">

    <!-- 不可名状暗影 angel(2) -->
    <img class="img-shadow" src="Gothic images/angel(2).png" style="
        position: absolute; top: 0%; left: 50%; margin-left: -35vw; width: 70vw; height: auto; filter: brightness(0.3) drop-shadow(0 0 30px rgba(255,255,255,0.2)); z-index: 3;
    ">

    <!-- 大天使 angel(1) (往上挪了！) -->
    <img class="img-angel" src="Gothic images/angel(1).png" style="
        position: absolute; bottom: 5vh; left: 50%; margin-left: -20vw; width: 40vw; height: auto; z-index: 4; filter: drop-shadow(0 0 20px rgba(0,0,0,0.9));
    ">

    <!-- 两侧尖塔 -->
    <img class="img-church-left" src="Gothic images/church(1).png" style="
        position: absolute; bottom: -5vh; left: 0; height: 110vh; width: auto; z-index: 5; filter: brightness(0.6) contrast(1.2);
    ">
    <img class="img-church-right" src="Gothic images/church(2).png" style="
        position: absolute; bottom: -5vh; right: 0; height: 110vh; width: auto; z-index: 5; filter: brightness(0.6) contrast(1.2);
    ">

    <!-- 字体 -->
    <img class="img-text" src="Gothic images/text.png" style="
        position: absolute; top: 2%; left: 50%; margin-left: -30vw; width: 60vw; z-index: 10; filter: drop-shadow(0 15px 20px rgba(0,0,0,0.9));
    ">

    <!-- 毛玻璃按钮 -->
    <a href="Gothic-detail.html" class="explore-btn">
        ENTER THE DARKNESS <span>↗</span>
    </a>

    <!-- 暗角 -->
    <div class="vignette-overlay"></div>

    <script>
    // 网页加载完成后，给 body 加一个 loaded 类，瞬间触发所有 CSS 动画
    window.addEventListener('load', () => {
        document.body.classList.add('loaded');
    });
</script>

</body>
</html>
