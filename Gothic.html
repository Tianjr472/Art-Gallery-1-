<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="gothic.css">
    <title>Gothic</title>
</head>
<body>

    <!-- 1. 纯黑底色 -->
    <div style="position: absolute; inset: 0; background-color: #050505; z-index: -1;"></div>

    <!-- 2. 左侧彩窗 (z-index: 1) -->
    <img src="Gothic images/window.png" style="
        position: absolute; 
        top: 5%; left: 10%;  
        width: 40vw; 
        height: auto;
        z-index: 1;
        filter: brightness(0.7) drop-shadow(0 0 30px rgba(255,255,255,0.2));
    ">

    <!-- 3. 圣光 (z-index: 2) -->
    <img src="Gothic images/light.png" style="
        position: absolute; 
        top: 10%; left: 50%; 
        transform: translateX(-50%);
        width: 50vw; 
        height: auto;
        z-index: 2;
        filter: brightness(2);
    ">

    <!-- 暗影 angel(2) (z-index: 3) -->
    <img src="Gothic images/angel(2).png" style="
        position: absolute; 
        top: 0%; left: 50%;  
        transform: translateX(-50%);
        width: 70vw; 
        height: auto; 
        filter: brightness(0.4) drop-shadow(0 0 30px rgba(255,255,255,0.1));
        z-index: 3;
    ">

    <!-- 5. 底部大天使 angel(1) (z-index: 4) -->
    <img src="Gothic images/angel(1).png" style="
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%); 
        height: 85vh; 
        width: auto;
        z-index: 4;
        filter: drop-shadow(0 0 20px rgba(0,0,0,0.9));
    ">

    <!-- 6. 左侧尖塔 (z-index: 5) -->
    <img src="Gothic images/church(1).png" style="
        position: absolute; 
        bottom: 0; left: -5vw; 
        height: 100vh; 
        width: auto;
        z-index: 5;
        filter: brightness(0.9) contrast(1.1);
    ">

    <!-- 7. 右侧尖塔 (z-index: 5) -->
    <img src="Gothic images/church(2).png" style="
        position: absolute; 
        bottom: -1vh; right: -5vw;
        height: 110vh; 
        width: auto;
        z-index: 5;
        filter: brightness(0.8) contrast(1.1);
    ">

    <!-- 8. 超级大字体 text.png (z-index: 10，永远在最上面) -->
    <img src="Gothic images/text.png" style="
        position: absolute;
        top: 5%;
        left: 50%;
        transform: translateX(-50%); 
        width: 80vw;
        z-index: 10;
        filter: drop-shadow(0 10px 10px rgba(0,0,0,0.8));
    ">

    <!-- 9. 毛玻璃按钮 -->
    <a href="Gothic-detail.html" class="explore-btn">
        ENTER THE DARKNESS <span>↗</span>
    </a>

    <!-- 10. 暗角 -->
    <div class="vignette-overlay"></div>

</body>
</html>
