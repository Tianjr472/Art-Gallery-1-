<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="venice.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
    <title>Venice</title>
</head>
</head>
<body>

    <!-- ========================================== -->
    <!-- 【第一层】最底层：大背景 + 宫殿(palace) -->
    <!-- ========================================== -->
    <div class="hero-bg"></div>

    <!-- 你提到的 palace 图，放在最底下（z-index: 0） -->
    <img class="gallery-img" src="Baroque images/palace.png" style="
        position: absolute; 
        top: 0; left: 0; 
        width: 100vw; 
        height: 100vh; 
        object-fit: cover;
        filter: brightness(0.4) contrast(1.1);
        z-index: 0;
    ">

      <img class="gallery-img" src="Baroque images/art.png" style="
        transform: scaleX(-1) rotate(10deg);
        position: absolute; 
        top: 61%; left: 55%; 
        width: 400px; 
        height: auto; 
        filter: brightness(0.6);
        z-index: 1;
    ">

    <!-- 其他底层照片（比如教堂、深色面具） -->
    <img class="gallery-img" src="Baroque images/church.png" style="
        position: absolute; 
        top: -10%; right: 27%; 
        width: 750px; 
        height: auto; 
        filter: brightness(1);
        z-index: 1;
    ">

    <!-- ========================================== -->
    <!-- 【第二层】两侧帷幕 (z-index: 2) -->
    <!-- ========================================== -->
    <div class="final-curtain left-final"></div>
    <div class="final-curtain right-final"></div>



    <!-- ========================================== -->
    <!-- 【第三层】在帷幕之上的元素 (z-index: 3 或 4) -->
    <!-- ========================================== -->
    <img class="gallery-img" src="Baroque images/bird.png" style="
        transform: scaleX(-1) rotate(50deg);
        position: absolute; 
        top: -8%; right: 22%; 
        width: 350px; 
        height: auto; 
        filter: brightness(1);
        z-index: 3;
    ">

        <!-- 被左边帷幕挡住一半的面具 (z-index: 1，比帷幕小) -->
    <img class="gallery-img" src="Baroque images/mask(1).png" style="
        transform: scaleX(-1) rotate(10deg);
        position: absolute; 
        top: 45%; left: 6%; 
        width: 400px; 
        height: auto; 
        filter: brightness(0.5);
        z-index: 3;
    ">
      

    <img class="gallery-img" src="Baroque images/mask.png" style="
        position: absolute; 
        top: 30%; left: -2%; 
        width: 370px; 
        height: auto; 
        filter: brightness(0.6);
        z-index: 3;
    ">

    
    <!-- light (打光/光效) -->
    <img class="gallery-img" src="Baroque images/light.png" style="
        position: absolute; 
        top: -30%; right: -1%; 
        width: 650px; 
        height: auto; 
        filter: brightness(0.8) drop-shadow(15px 15px 25px rgba(0, 0, 0, 0.9));
        z-index: 3; /* 👈 盖在帷幕上 */
    ">

    <!-- lamp (吊灯) -->
    <img class="gallery-img" src="Baroque images/lamp.png" style="
        position: absolute; 
        top: -13%; left: 0%; 
        width: 150px; 
        height: auto; 
        filter: brightness(0.9) drop-shadow(15px 15px 25px rgba(0, 0, 0, 0.9));
        z-index: 3; /* 👈 盖在帷幕上 */
    ">

        <!-- lamp (吊灯) -->
    <img class="gallery-img" src="Baroque images/lamp(1).png" style="
        position: absolute; 
        top: -34%; left: 4%; 
        width: 550px; 
        height: auto; 
        filter: brightness(0.7) drop-shadow(15px 15px 25px rgba(0, 0, 0, 0.9));
        z-index: 3;/*
    ">

    <!-- 马赛克 (我猜是你说的 Baroque material.png) -->
    <img class="gallery-img" src="Baroque images/Baroque-material.png" style="
        position: absolute; 
        top: -7%; left: 44%; 
        width: 200px; 
        height: auto; 
        filter: brightness(0.8);
        z-index: 4; /* 👈 放在最上面的装饰 */
    ">

    <!-- 雕塑 (你之前代码里有的) -->
    <img class="gallery-img" src="Baroque images/sculpture(1).png" style="
        position: absolute; 
        top: 20%; right: 3%; 
        width: 500px; 
        height: auto; 
        transform: rotate(-1deg);
        filter: brightness(1) contrast(1.1);
        z-index: 4; /* 👈 放在最上面的装饰 */
    ">


    <!-- ========================================== -->
    <!-- 【第四层】文字与毛玻璃 (z-index: 5) -->
    <!-- ========================================== -->
    <div class="center-title">
      <h1>Baroque</h1>
    </div>

    <div class="info-panel">
      <p class="subtitle">THE BAROQUE ERA</p>
      <h2>Dramatic & Grand</h2>
      <p class="desc">
          A world of intense light, deep shadows, and unrestrained emotion. 
          Discover how the Baroque transformed art into a theatrical stage.
      </p>
      <a href="baroque-details.html" class="explore-btn">
          EXPLORE THE STYLE <span>↗</span>
      </a>
    </div>

    <!-- ========================================== -->
    <!-- 【第五层】过场动画 (z-index: 10) -->
    <!-- ========================================== -->
    <div class="transition-layer">
        <div class="reveal-curtain left-reveal"></div>
        <div class="reveal-curtain right-reveal"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
